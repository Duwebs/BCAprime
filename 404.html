<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XS6DNV433X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-XS6DNV433X');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — Page Not Found | BCAPrime</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#fafafa;--surface:#ffffff;--surface-2:#f2f2f2;--ink:#171717;--muted:#4d4d4d;--line:#ebebeb;--brand:#0070f3;--brand-2:#d3e5ff}
    [data-theme=dark]{--bg:#0a0a0a;--surface:#141414;--surface-2:#1c1c1c;--ink:#ededed;--muted:#a1a1a1;--line:#2e2e2e;--brand:#3291ff;--brand-2:#12233d}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 82% 0%,rgba(0,112,243,.10),transparent 34%),var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;padding:20px}
    .card{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px 32px;text-align:center;box-shadow:0 8px 16px -4px rgba(0,0,0,.08)}
    .logo{width:64px;height:64px;object-fit:contain;border-radius:17px;box-shadow:0 8px 30px rgba(0,112,243,.30);margin-bottom:18px}
    .code{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(120deg,var(--brand),#7928ca);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:22px;font-weight:600;margin:14px 0 8px}
    p{color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:24px}
    .btns{display:grid;gap:10px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:9999px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);transition:transform .15s ease,filter .15s ease;cursor:pointer}
    .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .hint{margin:18px 0 0;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/logo.png" alt="BCAPrime">
    <div class="code">404</div>
    <h1>Yeh page library mein nahi mila</h1>
    <p>The page you're looking for doesn't exist, was moved, or the link is broken. Let's get you back to your notes.</p>
    <div class="btns">
      <a class="btn primary" href="/"><i>🏠</i> Go to Home</a>
      <a class="btn" href="/#library">📚 Browse library</a>
    </div>
    <p class="hint">bcaprime.vercel.app — free BCA notes &amp; PYQs</p>
  </main>
</body>
</html>
